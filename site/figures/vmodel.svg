<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="v-t v-d">
<title id="v-t">The project's V-model</title>
<desc id="v-d">Left side, top to bottom: mission needs, software requirements, architecture, detailed design, down to implementation. Right side, bottom to top: unit verification, integration, system verification, validation. Each right-side level verifies the left-side level opposite it: unit tests verify the detailed design, integration verifies the architecture, system tests verify the software requirements, and validation checks the mission needs.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-v" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="box" x="40" y="20" width="220" height="52" rx="3"/>
<text class="t" x="150.0" y="42" text-anchor="middle">Mission needs</text>
<text class="t2" x="150.0" y="60" text-anchor="middle">HKS-SYS-010 to 040</text>
<rect class="box" x="100" y="100" width="220" height="52" rx="3"/>
<text class="t" x="210.0" y="122" text-anchor="middle">Software requirements</text>
<text class="t2" x="210.0" y="140" text-anchor="middle">SR-010 to 180, FD-010 to 090</text>
<rect class="box" x="160" y="180" width="220" height="52" rx="3"/>
<text class="t" x="270.0" y="202" text-anchor="middle">Architecture</text>
<text class="t2" x="270.0" y="220" text-anchor="middle">components, DD-01 to DD-18</text>
<rect class="box" x="220" y="260" width="220" height="52" rx="3"/>
<text class="t" x="330.0" y="282" text-anchor="middle">Detailed design</text>
<text class="t2" x="330.0" y="300" text-anchor="middle">pipeline, packet layout</text>
<rect class="box-accent" x="740" y="20" width="220" height="52" rx="3"/>
<text class="t" x="850.0" y="42" text-anchor="middle">Validation</text>
<text class="t2" x="850.0" y="60" text-anchor="middle">4 mission needs demonstrated</text>
<rect class="box-accent" x="680" y="100" width="220" height="52" rx="3"/>
<text class="t" x="790.0" y="122" text-anchor="middle">System verification</text>
<text class="t2" x="790.0" y="140" text-anchor="middle">ST-01 to ST-10 on target</text>
<rect class="box-accent" x="620" y="180" width="220" height="52" rx="3"/>
<text class="t" x="730.0" y="202" text-anchor="middle">Integration</text>
<text class="t2" x="730.0" y="220" text-anchor="middle">Renode + ground decoder</text>
<rect class="box-accent" x="560" y="260" width="220" height="52" rx="3"/>
<text class="t" x="670.0" y="282" text-anchor="middle">Unit verification</text>
<text class="t2" x="670.0" y="300" text-anchor="middle">66 cases, host (Unity)</text>
<rect class="box-2" x="390" y="340" width="220" height="52" rx="3"/>
<text class="t" x="500.0" y="362" text-anchor="middle">Implementation</text>
<text class="t2" x="500.0" y="380" text-anchor="middle">C11 on RTEMS 7, 1,260 lines</text>
<path class="edge" d="M150,72 L190,98" marker-end="url(#a)"/>
<path class="edge" d="M210,152 L250,178" marker-end="url(#a)"/>
<path class="edge" d="M270,232 L310,258" marker-end="url(#a)"/>
<path class="edge" d="M330,312 L450,338" marker-end="url(#a)"/>
<path class="edge" d="M550,340 L690,314" marker-end="url(#a)"/>
<path class="edge" d="M690,260 L730,234" marker-end="url(#a)"/>
<path class="edge" d="M750,180 L790,154" marker-end="url(#a)"/>
<path class="edge" d="M810,100 L850,74" marker-end="url(#a)"/>
<path class="edge-v" d="M740,46.0 H262" marker-end="url(#v)"/>
<text class="t3" x="500" y="40.0" text-anchor="middle">validated against</text>
<path class="edge-v" d="M680,126.0 H322" marker-end="url(#v)"/>
<text class="t3" x="500" y="120.0" text-anchor="middle">verified by</text>
<path class="edge-v" d="M620,206.0 H382" marker-end="url(#v)"/>
<text class="t3" x="500" y="200.0" text-anchor="middle">verified by</text>
<path class="edge-v" d="M560,286.0 H442" marker-end="url(#v)"/>
<text class="t3" x="500" y="280.0" text-anchor="middle">verified by</text>
<text class="zl" x="40" y="392">SPECIFICATION AND DESIGN</text>
<text class="zl" x="960" y="392" text-anchor="end">VERIFICATION AND VALIDATION</text>
</svg>
