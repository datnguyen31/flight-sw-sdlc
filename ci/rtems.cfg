<?xml version="1.0"?>
<!--
  cppcheck library configuration for the RTEMS API used by the target code
  (src/app/tasks, src/app/rtems). The host CI job has no RTEMS headers, and
  cppcheck >= 2.13 abandons a file on an unknown file-scope macro
  (unknownMacro), which also hides its calls and yields false
  unusedFunction reports. These definitions give cppcheck a faithful enough
  expansion to analyze those files; sizes and alignment are irrelevant to
  the checks it runs.
-->
<def format="2">
  <define name="RTEMS_ALIGNED(n)" value=""/>
  <define name="RTEMS_TASK_STORAGE_ALIGNMENT" value="8"/>
  <define name="RTEMS_TASK_STORAGE_SIZE(size, attributes)" value="(size)"/>
  <define name="RTEMS_MESSAGE_QUEUE_BUFFER(size)" value="char"/>
  <define name="RTEMS_MINIMUM_STACK_SIZE" value="4096"/>
</def>
